<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon-cross.svg" />
    <link rel="preload" as="image" href="/loading-bg.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="algmed — Plateforme éducative pour étudiants en médecine : QCM, examens oraux, études de cas et ressources documentaires." />
    <meta property="og:title" content="algmed" />
    <meta property="og:description" content="Réussissez vos examens de médecine avec des QCM, des examens oraux et des études de cas." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://algmed.tech" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#ffffff" />
    <title>algmed</title>
    <script>
      // Apply the stored theme before first paint to avoid a flash.
      (function () {
        try {
          var dark = localStorage.getItem('darkMode') === 'true';
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
          document.documentElement.classList.toggle('dark-mode', dark);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#060a13' : '#ffffff');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
